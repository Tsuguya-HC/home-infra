# Cluster-wide inputs for scripts/genconfig.sh. Everything else is a patch under patches/.
clusterName: home-cluster
endpoint: https://192.168.10.229:6443
# Version contract passed to `talosctl gen config --talos-version`. It pins what the
# generator emits, independent of the talosctl binary doing the generating, and doubles
# as the installer image tag. Bump it only to upgrade Talos.
talosVersion: v1.14.0
kubernetesVersion: v1.37.0
# SecureBoot-signed custom build (talos-custom-build). Tag is talosVersion.
installer: ghcr.io/tsuguya-hc/installer
