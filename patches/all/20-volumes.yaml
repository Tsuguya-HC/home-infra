# Disk encryption: STATE and EPHEMERAL are LUKS2 volumes unlocked by the TPM.
apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  keys:
    - slot: 0
      tpm:
        checkSecurebootStatusOnEnroll: true
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
encryption:
  provider: luks2
  keys:
    - slot: 0
      tpm: {}
