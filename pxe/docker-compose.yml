services:
  dnsmasq:
    image: alpine:3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    command: ["sh", "-c", "apk add --no-cache dnsmasq && dnsmasq -d -C /etc/dnsmasq.conf"]
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
      - tftp-data:/var/lib/tftpboot:ro
    depends_on:
      ipxe-copy:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    ports:
      - "8888:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./boot.ipxe:/usr/share/nginx/html/boot.ipxe:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./config:/usr/share/nginx/html/config:ro
    restart: unless-stopped

  ipxe-copy:
    image: alpine:3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    command: ["cp", "/src/snponly.efi", "/tftpboot/snponly.efi"]
    volumes:
      - ./snponly.efi:/src/snponly.efi:ro
      - tftp-data:/tftpboot

volumes:
  tftp-data:
