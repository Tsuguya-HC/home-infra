# TRIGKEY G4 (N100), NVMe, enp1s0
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/nvme0n1"
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: 'off'
hostname: wn-01.cluster.internal
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp1s0
addresses:
  - address: 192.168.10.200/24
routes:
  - gateway: 192.168.10.1
