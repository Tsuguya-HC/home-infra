---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/aqua-yaml.json
#
# CLI versions for the lint workflow. aqua records a SHA256 for each binary in
# aqua-checksums.json and refuses to install anything that does not match, so the
# job that validates the machine config for every node in the cluster never runs an
# unverified download.
checksum:
  enabled: true
  # Fail rather than fall back to "just download it" when a checksum is missing.
  require_checksum: true
  # CI and the workstation are both linux/amd64; recording other platforms
  # would only pad the lock file.
  supported_envs:
    - linux/amd64

registries:
  - type: standard
    ref: v4.563.0 # renovate: depName=aquaproj/aqua-registry

packages:
  # talosctl renders and validates the machine configs. Kept on the cluster's Talos
  # version: `validate --strict` turns deprecation warnings into errors, so a newer
  # client failing here means the patches need the newer document format first.
  - name: siderolabs/talos@v1.14.0
  # yq reads cluster.yaml / nodes.yaml in scripts/genconfig.sh.
  - name: mikefarah/yq@v4.53.6
