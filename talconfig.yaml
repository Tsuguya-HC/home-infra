clusterName: home-cluster
talosVersion: v1.13.8
kubernetesVersion: v1.36.3
endpoint: https://192.168.10.229:6443

cniConfig:
  name: none

# Global patches (applied to all nodes)
patches:
  - |-
    cluster:
      proxy:
        disabled: true
      discovery:
        registries:
          kubernetes:
            disabled: true
    machine:
      install:
        wipe: false
      features:
        diskQuotaSupport: true
        kubePrism:
          enabled: true
          port: 7445
        hostDNS:
          enabled: true
          forwardKubeDNSToHost: true
      network:
        extraHostEntries:
          - ip: 10.107.133.63
            aliases:
              - registry.infra.tgy.io
      sysctls:
        kernel.kptr_restrict: "1"
      kubelet:
        defaultRuntimeSeccompProfileEnabled: true
        disableManifestsDirectory: true
      registries: {}
  - |-
    apiVersion: v1alpha1
    kind: VolumeConfig
    name: STATE
    encryption:
      provider: luks2
      keys:
        - slot: 0
          tpm:
            checkSecurebootStatusOnEnroll: true
  - |-
    apiVersion: v1alpha1
    kind: VolumeConfig
    name: EPHEMERAL
    provisioning:
      diskSelector:
        match: system_disk
    encryption:
      provider: luks2
      keys:
        - slot: 0
          tpm: {}

controlPlane:
  talosImageURL: ghcr.io/tsuguya/installer
  patches:
    - |-
      machine:
        nodeLabels:
          node.kubernetes.io/exclude-from-external-load-balancers: ""
    - |-
      cluster:
        apiServer:
          auditPolicy:
            apiVersion: audit.k8s.io/v1
            kind: Policy
            rules:
              - level: None
                nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version", "/metrics", "/openapi/*"]
              - level: None
                users: ["system:kube-scheduler", "system:kube-controller-manager", "system:kube-proxy"]
                verbs: ["get", "list", "watch"]
              - level: None
                userGroups: ["system:nodes"]
                verbs: ["get", "update", "patch"]
                resources:
                  - group: ""
                    resources: ["nodes/status"]
                  - group: "coordination.k8s.io"
                    resources: ["leases"]
              - level: None
                resources:
                  - group: ""
                    resources: ["serviceaccounts/token"]
                verbs: ["create"]
              - level: None
                resources:
                  - group: ""
                    resources: ["events"]
              - level: RequestResponse
                resources:
                  - group: ""
                    resources: ["secrets"]
                omitStages: ["RequestReceived"]
              - level: Request
                verbs: ["create", "update", "patch", "delete", "deletecollection"]
                omitStages: ["RequestReceived"]
              - level: Metadata
                omitStages: ["RequestReceived"]
    - |-
      cluster:
        apiServer:
          admissionControl:
            - name: PodSecurity
              configuration:
                apiVersion: pod-security.admission.config.k8s.io/v1
                kind: PodSecurityConfiguration
                defaults:
                  enforce: restricted
                  enforce-version: latest
                  warn: restricted
                  warn-version: latest
                  audit: restricted
                  audit-version: latest
                exemptions:
                  namespaces: []
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0
        scheduler:
          extraArgs:
            bind-address: 0.0.0.0
        etcd:
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381

worker:
  talosImageURL: ghcr.io/tsuguya/installer

nodes:
  # --- Control Plane Nodes (Gen2: AOOSTAR/TianBei N1 Pro, N150, SATA M.2, enp3s0) ---
  # 物理ポートは3台とも同じ側に挿すこと (挿す位置が違うと enp1s0 になる)
  #
  # installDisk (/dev/sda 固定) は使わない: USB メモリが刺さっていると列挙順が入れ替わり
  # sda が USB を指すことがある (3台目で実際に発生)。SATA AHCI (0000:00:17.0) 配下を
  # busPath で指定すれば USB を確実に除外でき、SSD 交換や ata1/ata2 の差も吸収できる。
  - hostname: cp-11.cluster.internal
    ipAddress: 192.168.10.231
    controlPlane: true
    installDiskSelector:
      busPath: /pci0000:00/0000:00:17.0/*
    networkInterfaces:
      - interface: enp3s0
        dhcp: false
        addresses:
          - 192.168.10.231/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.10.1
        vip:
          ip: 192.168.10.229
    nameservers:
      - 192.168.10.1

  - hostname: cp-12.cluster.internal
    ipAddress: 192.168.10.232
    controlPlane: true
    installDiskSelector:
      busPath: /pci0000:00/0000:00:17.0/*
    networkInterfaces:
      - interface: enp3s0
        dhcp: false
        addresses:
          - 192.168.10.232/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.10.1
        vip:
          ip: 192.168.10.229
    nameservers:
      - 192.168.10.1

  - hostname: cp-13.cluster.internal
    ipAddress: 192.168.10.230
    controlPlane: true
    installDiskSelector:
      busPath: /pci0000:00/0000:00:17.0/*
    networkInterfaces:
      - interface: enp3s0
        dhcp: false
        addresses:
          - 192.168.10.230/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.10.1
        vip:
          ip: 192.168.10.229
    nameservers:
      - 192.168.10.1

  # --- Worker Nodes (TRIGKEY G4, enp1s0) ---
  - hostname: wn-01.cluster.internal
    ipAddress: 192.168.10.200
    controlPlane: false
    installDisk: /dev/nvme0n1
    networkInterfaces:
      - interface: enp1s0
        dhcp: false
        addresses:
          - 192.168.10.200/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.10.1
    nameservers:
      - 192.168.10.1

  - hostname: wn-02.cluster.internal
    ipAddress: 192.168.10.201
    controlPlane: false
    installDisk: /dev/sda
    networkInterfaces:
      - interface: enp1s0
        dhcp: false
        addresses:
          - 192.168.10.201/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.10.1
    nameservers:
      - 192.168.10.1
    patches:
      - |-
        machine:
          files:
            - content: ""
              path: /var/mnt/kanidm/.keep
              op: create
              permissions: 0o644

  - hostname: wn-03.cluster.internal
    ipAddress: 192.168.10.202
    controlPlane: false
    installDisk: /dev/nvme0n1
    networkInterfaces:
      - interface: enp1s0
        dhcp: false
        addresses:
          - 192.168.10.202/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.10.1
    nameservers:
      - 192.168.10.1
    patches:
      - |-
        machine:
          files:
            - content: ""
              path: /var/mnt/kanidm/.keep
              op: create
              permissions: 0o644
