apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  apiVersion: pod-security.admission.config.k8s.io/v1
  kind: PodSecurityConfiguration
  defaults:
    enforce: restricted
    enforce-version: latest
    warn: restricted
    warn-version: latest
    audit: restricted
    audit-version: latest
  exemptions:
    # kube-system was always exempt: the talhelper-era `namespaces: []` never took effect
    # (Talos merged it with its default), and Cilium's pods there need the exemption.
    namespaces: ["kube-system"]
