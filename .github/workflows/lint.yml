name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Only zizmor's SARIF upload needs the token; it names its own scope. A new job
# added below starts with nothing.
#
# The Claude reviewer used to live in this file. It now sits in
# claude-review.yml, because claude-code-action validates its entry-point
# workflow against main and a PR that edits this file would otherwise be
# unreviewable.
permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: talconfig.yaml

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3

      - name: Validate talconfig
        run: talhelper validate talconfig

  # Checks the workflow expressions and job graph, and shells out to shellcheck
  # for every `run:` block.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3

      - name: Lint workflows
        run: |
          set -euo pipefail
          # actionlint silently skips its shell checks when shellcheck is
          # absent, which would quietly reduce this job to expression linting
          # if the runner image ever drops it.
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is not on the runner; actionlint would skip every run: block"
            exit 1
          }
          actionlint -no-color

  # Static audit of the workflows themselves: template injection, credential
  # persistence, permission scope, spoofable bot conditions. The action resolves
  # the version below to a digest-pinned container, so nothing here floats.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning (free on public repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          version: "1.29.0"
